_format_version: "3.0"
_transform: true

services:
  - name: wealthops-api
    url: http://api:8080
    routes:
      - name: wealthops-api-v1
        paths:
          - /api
        strip_path: false
        protocols:
          - http
  - name: wealthops-openapi
    url: http://api:8080
    routes:
      - name: wealthops-openapi-v1
        paths:
          - /openapi
        strip_path: false
        protocols:
          - http
