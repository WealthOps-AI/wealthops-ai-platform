services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wealthops
      POSTGRES_USER: wealthops_local
      POSTGRES_PASSWORD: ${WEALTHOPS_DB_PASSWORD:-wealthops-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthops_local -d wealthops"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrator:
    build:
      context: ../../../wealthops-backend
      dockerfile: Dockerfile
      target: migrator
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__WealthOps: Host=postgres;Port=5432;Database=wealthops;Username=wealthops_local;Password=${WEALTHOPS_DB_PASSWORD:-wealthops-local-only}
      Seed__Enabled: "true"
    command: ["--seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../../../wealthops-backend
      dockerfile: Dockerfile
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__WealthOps: Host=postgres;Port=5432;Database=wealthops;Username=wealthops_local;Password=${WEALTHOPS_DB_PASSWORD:-wealthops-local-only}
      Authentication__Audience: wealthops-api
      Authentication__DevelopmentIssuer: wealthops-local
      Authentication__DevelopmentSigningKey: ${WEALTHOPS_AUTH_DEV_SIGNING_KEY:-wealthops-development-only-not-for-production-32-byte-key}
      Cors__AllowedOrigins__0: http://localhost:5173
      Cors__AllowedOrigins__1: http://localhost:8088
    expose:
      - "8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kong:
    image: kong:3.9.1
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/null
      KONG_ADMIN_LISTEN: "off"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ../../gateway/kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../../wealthops-web
      dockerfile: Dockerfile
    ports:
      - "8088:8080"
    depends_on:
      - kong
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    profiles: ["messaging", "full"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  airflow:
    image: apache/airflow:2.10.5
    profiles: ["pipelines", "full"]
    command: standalone
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${WEALTHOPS_AIRFLOW_SECRET_KEY:-local-airflow-secret-only}
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${WEALTHOPS_AIRFLOW_PASSWORD:-local-airflow-only}
    ports:
      - "8080:8080"
    volumes:
      - ../../../wealthops-pipelines/dags:/opt/airflow/dags:ro
      - airflow-data:/opt/airflow
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
  airflow-data:
